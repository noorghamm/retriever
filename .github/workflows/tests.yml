name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v

  c-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build C client
        run: make -C c
      - name: Interop tests
        run: python -m pytest tests/test_c_interop.py -v
      - name: Valgrind the C client
        run: |
          # start a server in the background, then run the client under
          # valgrind: any leak or invalid access fails the job
          python -m retriever.server 5050 &
          sleep 2
          valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=all \
                   ./c/retriever 127.0.0.1 5050 list
