name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v

  c-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build C client
        run: make -C c
      - name: Interop tests
        run: python -m pytest tests/test_c_interop.py -v
      - name: Valgrind the C client
        run: |
          # The interop step rebuilds with AddressSanitizer, and valgrind
          # cannot run an ASan-instrumented binary (their shadow memory
          # maps collide), so start from a clean plain build here.
          make -C c clean && make -C c
          python -m retriever.server 5050 &
          sleep 2
          # default leak kinds only: glibc's getaddrinfo leaves "still
          # reachable" allocations from loading NSS modules, which are
          # not ours and not leaks in any useful sense
          valgrind --error-exitcode=1 --leak-check=full \
                   ./c/retriever 127.0.0.1 5050 list
